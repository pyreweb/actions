name: PHP-CI

on:
  workflow_call:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'

    steps:
      - name: Checkout
        uses: pyreweb/github_actions/.github/actions/checkout@main

      - name: Setup PHP ${{ matrix.php }}
        uses: pyreweb/github_actions/.github/actions/setup/php@main
        with:
          php-version: ${{ matrix.php }}

      - name: Install dependencies
        uses: pyreweb/github_actions/.github/actions/composer/install@main

      - name: Run tests
        uses: pyreweb/github_actions/.github/actions/composer/test@main
