name: pyreweb/dependencies/update

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Mise à jour des dépendances
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v6

      - name: Génération ID unique
        id: date
        run: |
          echo "BRANCH_NAME=dependencies-update-$(date +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_ENV
          echo "PRETTY_DATE=$(date +'%d/%m/%Y à %H:%M:%S')" >> $GITHUB_ENV

      - name: Configuration de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, json
          tools: composer:v2
          coverage: none

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Récupération du dossier de cache Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Mise en cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Création du fichier .env
        run: cp .env.example .env

      - name: Installation initiale des dépendances
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      - name: Mise à jour des dépendances
        id: update
        run: |
          composer update --no-interaction --no-progress
          npm update

      - name: Build Frontend
        run: npm run build

      - name: Génération de la clé d'application
        run: php artisan key:generate

      - name: Tests Backend
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Tests Frontend
        run: npm test --if-present

      - name: Création de la Pull Request automatique
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: mise à jour des dépendances"
          committer: GitHub <noreply@github.com>
          author: GitHub Actions <actions@github.com>
          branch: ${{ env.BRANCH_NAME }}
          delete-branch: true
          title: "Mise à jour des dépendances - ${{ env.PRETTY_DATE }}"
          body: |
            Mise à jour automatique des dépendances du projet.
            
            `Pull Request générée automatiquement par GitHub Actions.`
            **Run ID**: ${{ github.run_id }}
          labels: |
            github-action
            dependencies
