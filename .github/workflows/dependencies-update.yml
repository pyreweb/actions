name: Mise à jour des dépendances

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Mise à jour des dépendances
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.5'

    steps:
      - name: Consultation du répertoire
        uses: pyreweb/github_actions/.github/actions/checkout@main

      - name: Génération de l'identifiant unique
        id: date
        run: |
          echo "BRANCH_NAME=actions/chore-dependencies-update-$(date +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_ENV
          echo "PRETTY_DATE=$(date +'%d/%m/%Y à %H:%M:%S')" >> $GITHUB_ENV

      - name: Configuration de PHP ${{ matrix.php }}
        uses: pyreweb/github_actions/.github/actions/setup/php@main
        with:
          php-version: ${{ matrix.php }}

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Restauration du répertoire de cache de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Mise en cache de Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Création du fichier .env
        run: cp .env.example .env

      - name: Configuration initiale des dépendances
        run: |
          composer install
          npm ci

      - name: Mise à jour des dépendances
        id: update
        run: |
          composer update
          npm update

      - name: Compilation du frontend
        run: npm run build

      - name: Génération de la clé d'application
        run: php artisan key:generate

      - name: Tests du backend
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Tests de l'interface utilisateur
        run: npm test --if-present

      - name: Créer une pull request automatique
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): mise à jour des dépendances"
          committer: GitHub <noreply@github.com>
          author: GitHub Actions <actions@github.com>
          branch: ${{ env.BRANCH_NAME }}
          delete-branch: true
          title: "Mise à jour des dépendances - ${{ env.PRETTY_DATE }}"
          body: |
            `Pull request générée automatiquement par GitHub Actions.`
            
            **Numéro de série**: ${{ github.run_id }}
          labels: |
            chore
            chore(deps)
            action
