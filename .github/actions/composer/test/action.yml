name: Tests automatiques
description: Exécute l’ensemble des tests de l’application et vérifie que chaque fonctionnalité se comporte comme prévu. À lancer avant de valider une modification, pour s’assurer qu’elle n’a rien cassé d’existant.

runs:
    using: composite
    steps:
        - name: Lancement de la commande
          shell: bash
          run: composer test
