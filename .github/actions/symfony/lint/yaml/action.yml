name: Symfony / Relecture des fichiers YAML
description: Vérifie la syntaxe des fichiers YAML de configuration Symfony, y compris les balises spécifiques comme !tagged_iterator. À lancer pour repérer une erreur de configuration avant qu’elle n’empêche l’application de démarrer.

runs:
    using: composite
    steps:
        - name: Lancement de la commande
          shell: bash
          run: php bin/console lint:yaml config --parse-tags
