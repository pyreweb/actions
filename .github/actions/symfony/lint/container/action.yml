name: Symfony / Relecture du conteneur de services
description: Vérifie que la configuration des services Symfony est valide, en contrôlant notamment les arguments injectés, leurs types et les services manquants. À lancer pour détecter une erreur de configuration avant qu’elle ne casse l’application.

runs:
    using: composite
    steps:
        - name: Lancement de la commande
          shell: bash
          run: php bin/console lint:container
