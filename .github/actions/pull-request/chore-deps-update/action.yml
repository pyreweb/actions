name: Chore Deps Update
description: Chore Deps Update

inputs:
    github-token:
        description: GitHub Token
        required: true
    github-run-id:
        description: GitHub Run ID
        required: true

runs:
    using: composite
    steps:
        - name: Creation of the pull request
          uses: peter-evans/create-pull-request@v8
          with:
              token: ${{ inputs.github-token }}
              commit-message: |
                  build(deps): met à jour les dépendances composer et npm

                  Met à jour les dépendances PHP gérées par composer et les dépendances JavaScript gérées par npm vers leurs dernières versions compatibles, en régénérant les fichiers composer.lock et package-lock.json. Cette mise à jour apporte les correctifs de bugs et de sécurité publiés depuis la dernière synchronisation, sans modifier le code applicatif.
              committer: pyreweb2 <support@pyreweb.com>
              author: pyreweb2 <support@pyreweb.com>
              branch: build/met-a-jour-les-dependances-composer-et-npm
              delete-branch: true
              title: 'Mise à jour des dépendances Composer et NPM'
              body: |
                  ## Mise à jour automatique des dépendances

                  Cette pull request est générée automatiquement par le workflow de mise à jour des dépendances.

                  ### Contenu

                  - Mise à jour des dépendances PHP via `composer update` (`composer.lock`)
                  - Mise à jour des dépendances JavaScript via `npm update` (`package-lock.json`)
                  - Aucune modification du code applicatif

                  ### Vérifications avant fusion

                  - [ ] La CI est au vert (tests, analyse statique, build des assets)
                  - [ ] Les notes de version des mises à jour majeures ont été relues
                  - [ ] Aucune dépréciation ou rupture de compatibilité Symfony n'est signalée
                  - [ ] L'application démarre correctement et les parcours principaux fonctionnent

                  ### Informations d'exécution

                  | Élément | Valeur |
                  | --- | --- |
                  | ID du run | [${{ inputs.github-run-id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.github-run-id }}) |
                  | Dépôt | ${{ github.repository }} |
                  | Branche de base | `${{ github.event.repository.default_branch }}` |
              labels: |
                  build
                  deps
                  composer
                  npm
